apiVersion: batch/v1
kind: CronJob
metadata:
  name: init-requests-cronjob
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: init-requests-cronjob
        spec:
          containers:
          - name: app
            image: busybox:1.36
            resources:
              requests:
                cpu: 250m
                memory: 64Mi
          initContainers:
          - name: already-requested
            image: busybox:1.36
            resources:
              requests:
                cpu: 250m
                memory: 64Mi
          - name: setup
            image: busybox:1.36
          restartPolicy: OnFailure

apiVersion: v1
kind: Pod
metadata:
  name: windows-pod
  labels:
    app: windows-pod
spec:
  containers:
  - name: test-container
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      allowPrivilegeEscalation: false
  - name: test-container2
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      allowPrivilegeEscalation: false
      windowsOptions:
        gmsaCredentialSpec: "<credSpecContents>"

apiVersion: v1
kind: Pod
metadata:
  name: test-pod-with-unsafe-ephemeral
  labels:
    app: myapp
spec:
  containers:
  - name: safe-container
    image: nginx:latest
    securityContext:
      seccompProfile:
        type: RuntimeDefault
  ephemeralContainers:
  - name: unsafe-debug
    image: busybox:latest
    # No securityContext - this ephemeralContainer should be flagged

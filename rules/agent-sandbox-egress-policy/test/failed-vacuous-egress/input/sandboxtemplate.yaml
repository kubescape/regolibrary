apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: vacuous-egress-template
  namespace: default
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    egress:
    - {}
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: python-runtime
        image: python:3.11-slim

apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: ingress-only-template
  namespace: default
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
    - from:
      - ipBlock:
          cidr: 10.0.0.0/24
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: python-runtime
        image: python:3.11-slim

apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: egress-no-to-template
  namespace: default
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    egress:
    - ports:
      - port: 53
        protocol: UDP
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: python-runtime
        image: python:3.11-slim

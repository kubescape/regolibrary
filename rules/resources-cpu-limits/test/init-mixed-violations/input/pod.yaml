apiVersion: v1
kind: Pod
metadata:
  name: init-mixed-violations
spec:
  containers:
  - name: app
    image: busybox:1.36
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
  - name: worker
    image: busybox:1.36
  initContainers:
  - name: already-limited
    image: busybox:1.36
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
  - name: sidecar
    image: busybox:1.36
    restartPolicy: Always
  - name: setup
    image: busybox:1.36
    resources:
      requests:
        cpu: 100m
        memory: 32Mi

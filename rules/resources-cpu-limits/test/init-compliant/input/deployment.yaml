apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-compliant-deployment
spec:
  template:
    metadata:
      labels:
        app: init-compliant-deployment
    spec:
      containers:
      - name: app
        image: busybox:1.36
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
      initContainers:
      - name: setup
        image: busybox:1.36
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
  selector:
    matchLabels:
      app: init-compliant-deployment

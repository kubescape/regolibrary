apiVersion: v1
kind: Pod
metadata:
  name: init-reads-aws
spec:
  initContainers:
  - name: fetch-creds
    image: amazon/aws-cli
    volumeMounts:
    - mountPath: /root/.aws
      name: aws-creds
  containers:
  - name: app
    image: nginx
  volumes:
  - name: aws-creds
    hostPath:
      path: /.aws/credentials

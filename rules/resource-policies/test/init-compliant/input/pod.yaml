apiVersion: v1
kind: Pod
metadata:
  name: init-compliant
spec:
  initContainers:
  - name: migrate
    image: images.my-company.example/migrate:v1
    resources:
      limits:
        cpu: "250m"
        memory: "64Mi"
  containers:
  - name: app
    image: images.my-company.example/app:v4
    resources:
      limits:
        cpu: "500m"
        memory: "128Mi"
  ephemeralContainers:
  - name: debugger
    image: busybox:1.36

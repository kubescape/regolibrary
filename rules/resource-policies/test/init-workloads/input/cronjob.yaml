apiVersion: batch/v1
kind: CronJob
metadata:
  name: init-cronjob
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: fetch
            image: busybox:1.36
            resources:
              requests:
                cpu: "100m"
          containers:
          - name: report
            image: busybox:1.36
            resources:
              limits:
                cpu: "500m"
                memory: "128Mi"

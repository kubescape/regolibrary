apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-deployment
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        resources:
          limits:
            memory: "64Mi"
      containers:
      - name: web
        image: nginx:1.27
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"

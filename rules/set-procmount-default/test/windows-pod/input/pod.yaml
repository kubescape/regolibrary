apiVersion: v1
kind: Pod
metadata:
  name: iis
spec:
  os:
    name: windows
  securityContext:
    runAsNonRoot: true
    windowsOptions:
      runAsUserName: ContainerUser
  initContainers:
  - name: init
    image: mcr.microsoft.com/windows/nanoserver:ltsc2022
  containers:
  - name: iis
    image: mcr.microsoft.com/windows/servercore/iis:windowsservercore-ltsc2022
  ephemeralContainers:
  - name: debugger
    image: mcr.microsoft.com/windows/nanoserver:ltsc2022

apiVersion: batch/v1
kind: CronJob
metadata:
  name: init-cronjob
  namespace: kube-system
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: init-setup
            image: k8s.gcr.io/busybox:1.28
          containers:
          - name: app
            image: registry.k8s.io/pause:3.9
          restartPolicy: OnFailure

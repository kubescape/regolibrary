apiVersion: batch/v1
kind: CronJob
metadata:
  name: windows-cronjob
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: test-container
            image: mcr.microsoft.com/windows/servercore:ltsc2019
            securityContext:
              windowsOptions:
                hostProcess: false
          - name: test-container2
            image: mcr.microsoft.com/windows/servercore:ltsc2019
            securityContext:
              windowsOptions:
                hostProcess: true
          restartPolicy: OnFailure

apiVersion: v1
kind: Pod
metadata:
  name: windows-hostprocess-containers
spec:
  os:
    name: windows
  hostNetwork: true
  initContainers:
  - name: init-container
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      windowsOptions:
        hostProcess: true
  containers:
  - name: test-container
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      windowsOptions:
        hostProcess: false
  - name: test-container2
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      windowsOptions:
        hostProcess: true
  ephemeralContainers:
  - name: debug-container
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      windowsOptions:
        hostProcess: true

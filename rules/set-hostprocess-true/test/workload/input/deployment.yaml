apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows-deployment
  labels:
    app: windows-deployment
spec:
  selector:
    matchLabels:
      app: windows-deployment
  template:
    metadata:
      labels:
        app: windows-deployment
    spec:
      os:
        name: windows
      containers:
      - name: test-container
        image: mcr.microsoft.com/windows/servercore:ltsc2019
        securityContext:
          windowsOptions:
            hostProcess: false
      - name: test-container2
        image: mcr.microsoft.com/windows/servercore:ltsc2019
        securityContext:
          windowsOptions:
            hostProcess: true

apiVersion: v1
kind: Pod
metadata:
  labels:
    component: kube-controller-manager
    tier: control-plane
  name: kube-controller-manager-rke2-server
  namespace: kube-system
spec:
  containers:
    - command:
        - kube-controller-manager
      args:
        - '--bind-address=192.168.0.1'
        - '--leader-elect=true'
        - '--root-ca-file=/var/lib/rancher/rke2/server/tls/server-ca.crt'
      image: index.docker.io/rancher/hardened-kubernetes:v1.32.11-rke2r1
      name: kube-controller-manager
  hostNetwork: true
  nodeName: rke2-server

apiVersion: v1
kind: Pod
metadata:
  name: audit-pod
spec:
  containers:
  # containerd upper-cases capability names and CRI-O also takes the CAP_ prefix
  - name: drops-net-raw
    image: hashicorp/http-echo:0.2.3
    securityContext:
      capabilities:
        drop: ["net_raw"]
  - name: drops-cap-net-raw
    image: hashicorp/http-echo:0.2.3
    securityContext:
      capabilities:
        drop: ["CAP_NET_RAW"]
  - name: adds-net-raw-back
    image: hashicorp/http-echo:0.2.3
    securityContext:
      capabilities:
        add: ["net_raw"]
        drop: ["All"]

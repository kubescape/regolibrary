apiVersion: v1
kind: Pod
metadata:
  name: test
spec:
  containers:
    - name: app
      image: nginx
      securityContext:
        capabilities:
          drop: ["NET_RAW"]
  ephemeralContainers:
    - name: debugger
      image: busybox
      securityContext:
        capabilities:
          drop: ["NET_ADMIN"]

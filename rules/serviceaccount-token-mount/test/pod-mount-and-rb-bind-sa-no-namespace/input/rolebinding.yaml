apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: my-role-binding
  namespace: default
subjects:
# no namespace: the subject is the "default" ServiceAccount in "default"
- kind: ServiceAccount
  name: default
roleRef:
  kind: Role
  name: my-role
  apiGroup: rbac.authorization.k8s.io

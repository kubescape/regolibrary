apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-test
  namespace: default
subjects:
# no namespace: Kubernetes resolves this ServiceAccount in the RoleBinding's namespace
- kind: ServiceAccount
  name: default
roleRef:
  kind: ClusterRole
  name: test
  apiGroup: rbac.authorization.k8s.io

apiVersion: v1
kind: Pod
metadata:
  name: windows-pod-init
spec:
  os:
    name: windows
  initContainers:
  - name: init
    image: mcr.microsoft.com/windows/servercore:ltsc2019
  containers:
  - name: app
    image: mcr.microsoft.com/windows/servercore:ltsc2019
    securityContext:
      windowsOptions:
        runAsUserName: "ContainerUser"

apiVersion: v1
kind: Pod
metadata:
  name: windows-pod-all
spec:
  nodeSelector:
    kubernetes.io/os: windows
  initContainers:
  - name: init
    image: mcr.microsoft.com/windows/servercore:ltsc2019
  containers:
  - name: app
    image: mcr.microsoft.com/windows/servercore:ltsc2019
  ephemeralContainers:
  - name: debugger
    image: mcr.microsoft.com/windows/servercore:ltsc2019

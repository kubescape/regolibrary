apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-debug-pods
  namespace: my-ns
spec:
  podSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
      - key: controller-uid
        operator: Exists
      - key: debug
        operator: DoesNotExist
  policyTypes:
    - Ingress
    - Egress

apiVersion: v1
kind: Pod
metadata:
  labels:
    component: kube-scheduler
    tier: control-plane
  name: kube-scheduler
  namespace: kube-system
spec:
  containers:
    - command:
        - kube-scheduler
      args:
        - '--v=2'
        - '--profiling=false'
        - '--profiling=true'
      image: registry.k8s.io/kube-scheduler:v1.31.0
      name: kube-scheduler

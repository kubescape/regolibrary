apiVersion: v1
kind: Pod
metadata:
  name: test
spec:
  initContainers:
    - name: init-setup
      image: debian:latest
      imagePullPolicy: IfNotPresent # We look for this
    - name: init-pinned
      image: debian:latest
      imagePullPolicy: Always
  containers:
    - name: app
      image: nginx:1.27
      imagePullPolicy: IfNotPresent

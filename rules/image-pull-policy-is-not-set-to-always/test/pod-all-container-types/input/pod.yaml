apiVersion: v1
kind: Pod
metadata:
  name: test
spec:
  initContainers:
    - name: init-setup
      image: debian:latest
      imagePullPolicy: IfNotPresent # We look for this
  containers:
    - name: app
      image: nginx
      imagePullPolicy: IfNotPresent # We look for this
  ephemeralContainers:
    - name: debug
      image: busybox:latest
      imagePullPolicy: Never # We look for this

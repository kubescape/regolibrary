# Snapshot of an existing Pod after adding a debug container through the ephemeralcontainers subresource.
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-excluded
  uid: af3dfba0-a768-4c83-b6ed-952a12dbe856
  resourceVersion: '856'
spec:
  containers:
  - name: app
    image: busybox:1.36
    resources:
      requests:
        cpu: 250m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  initContainers:
  - name: setup
    image: busybox:1.36
    resources:
      requests:
        cpu: 250m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  ephemeralContainers:
  - name: debugger
    image: busybox:1.36
    targetContainerName: app
    command:
    - sh
status:
  phase: Running

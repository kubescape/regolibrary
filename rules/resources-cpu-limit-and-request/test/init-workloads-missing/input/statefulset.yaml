apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: init-workloads-statefulset
spec:
  serviceName: "init-workloads-statefulset"
  selector:
    matchLabels:
      app: init-workloads-statefulset
  template:
    metadata:
      labels:
        app: init-workloads-statefulset
    spec:
      containers:
      - name: app
        image: busybox:1.36
        resources:
          requests:
            cpu: 250m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      initContainers:
      - name: setup
        image: busybox:1.36

apiVersion: v1
kind: Pod
metadata:
  name: init-pod-exceeded
spec:
  containers:
  - name: app
    image: busybox:1.36
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
  initContainers:
  - name: setup
    image: busybox:1.36
    resources:
      requests:
        cpu: 250m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi

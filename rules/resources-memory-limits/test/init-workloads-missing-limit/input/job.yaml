apiVersion: batch/v1
kind: Job
metadata:
  name: init-limits-job
spec:
  template:
    metadata:
      labels:
        app: init-limits-job
    spec:
      containers:
      - name: app
        image: busybox:1.36
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
      initContainers:
      - name: already-limited
        image: busybox:1.36
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
      - name: setup
        image: busybox:1.36
      restartPolicy: OnFailure

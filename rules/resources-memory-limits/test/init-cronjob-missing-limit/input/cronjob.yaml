apiVersion: batch/v1
kind: CronJob
metadata:
  name: init-limits-cronjob
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: init-limits-cronjob
        spec:
          containers:
          - name: app
            image: busybox:1.36
            resources:
              limits:
                cpu: 500m
                memory: 128Mi
          initContainers:
          - name: already-limited
            image: busybox:1.36
            resources:
              limits:
                cpu: 500m
                memory: 128Mi
          - name: setup
            image: busybox:1.36
          restartPolicy: OnFailure

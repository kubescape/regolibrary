apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: nginx
          ports:
            - containerPort: 80
      initContainers:
        - name: init-setup
          image: busybox
          ports:
            - containerPort: 8086
              hostPort: 8086 # We look for this

apiVersion: v1
kind: ReplicationController
metadata:
  name: existing-sa-rc
  namespace: app
spec:
  replicas: 1
  selector:
    app: existing-sa-rc
  template:
    metadata:
      labels:
        app: existing-sa-rc
    spec:
      serviceAccountName: rc-runner
      containers:
      - name: app
        image: nginx

apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: mixed-tags-template
  namespace: default
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: pinned-container
        image: gcr.io/my-project/agent:1.2.3
      - name: latest-container
        image: gcr.io/my-project/tools:latest

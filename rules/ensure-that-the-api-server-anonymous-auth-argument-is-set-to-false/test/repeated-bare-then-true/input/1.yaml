apiVersion: v1
kind: Pod
metadata:
  labels:
    component: kube-apiserver
    tier: control-plane
  name: kube-apiserver
  namespace: kube-system
spec:
  containers:
    - command:
        - kube-apiserver
      args:
        - '--v=2'
        - '--anonymous-auth'
        - '--anonymous-auth=true'
      image: registry.k8s.io/kube-apiserver:v1.31.0
      name: kube-apiserver

apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: scratch
      mountPath: /scratch
  volumes:
  - name: scratch
    emptyDir: {}
  - name: target
    secret:
      secretName: mysecret
  initContainers:
  - name: setup
    image: busybox
    volumeMounts:
    - name: scratch
      mountPath: /data

apiVersion: v1
kind: Pod
metadata:
  name: mypod
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: scratch
      mountPath: /scratch
  volumes:
  - name: scratch
    emptyDir: {}
  - name: target
    persistentVolumeClaim:
      claimName: myclaim
  initContainers:
  - name: setup
    image: busybox
    volumeMounts:
    - name: target
      mountPath: /data
  ephemeralContainers:
  - name: debugger
    image: busybox
    volumeMounts:
    - name: target
      mountPath: /data

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: init-workloads-daemonset
spec:
  selector:
    matchLabels:
      app: init-workloads-daemonset
  template:
    metadata:
      labels:
        app: init-workloads-daemonset
    spec:
      containers:
      - name: app
        image: busybox:1.36
        resources:
          requests:
            cpu: 250m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      initContainers:
      - name: setup
        image: busybox:1.36

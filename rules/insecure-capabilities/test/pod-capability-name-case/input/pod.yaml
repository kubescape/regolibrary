apiVersion: v1
kind: Pod
metadata:
  name: test
spec:
  containers:
  - name: test
    image: nginx
    securityContext:
      capabilities:
        # containerd upper-cases these names and CRI-O also takes the CAP_ prefix,
        # so this adds SYS_ADMIN and NET_ADMIN
        add: ["sys_admin", "CAP_NET_ADMIN", "chown"]

apiVersion: v1
kind: Pod
metadata:
  name: windows-pod-level
spec:
  os:
    name: windows
  securityContext:
    windowsOptions:
      gmsaCredentialSpecName: "gmsa-webapp"
  initContainers:
  - name: init
    image: mcr.microsoft.com/windows/servercore:ltsc2019
  containers:
  - name: app
    image: mcr.microsoft.com/windows/servercore:ltsc2019
  ephemeralContainers:
  - name: debugger
    image: mcr.microsoft.com/windows/servercore:ltsc2019

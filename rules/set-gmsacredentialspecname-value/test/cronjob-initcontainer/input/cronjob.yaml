apiVersion: batch/v1
kind: CronJob
metadata:
  name: windows-cronjob-init
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          os:
            name: windows
          initContainers:
          - name: init
            image: mcr.microsoft.com/windows/servercore:ltsc2019
          containers:
          - name: app
            image: mcr.microsoft.com/windows/servercore:ltsc2019
            securityContext:
              windowsOptions:
                gmsaCredentialSpecName: "gmsa-webapp"
          restartPolicy: OnFailure

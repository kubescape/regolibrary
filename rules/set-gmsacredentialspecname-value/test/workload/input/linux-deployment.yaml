apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-linux-deployment
spec:
  selector:
    matchLabels:
      app: plain-linux-deployment
  template:
    metadata:
      labels:
        app: plain-linux-deployment
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: nginx
        image: nginx:1.25
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false

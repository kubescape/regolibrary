apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: builder-pod-exec
  namespace: ci
subjects:
# no namespace: the subject is the "builder" ServiceAccount in "ci"
- kind: ServiceAccount
  name: builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-exec

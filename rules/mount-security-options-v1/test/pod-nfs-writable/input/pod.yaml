apiVersion: v1
kind: Pod
metadata:
  name: writable-nfs-pod
spec:
  containers:
    - name: app
      image: nginx:latest
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      nfs:
        server: 10.0.0.10
        path: /exports/data
        readOnly: false

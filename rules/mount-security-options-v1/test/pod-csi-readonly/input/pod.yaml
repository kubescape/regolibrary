apiVersion: v1
kind: Pod
metadata:
  name: readonly-csi-pod
spec:
  containers:
    - name: app
      image: nginx:latest
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      csi:
        driver: example.csi.k8s.io
        volumeHandle: test-volume
        readOnly: true

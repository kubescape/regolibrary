apiVersion: v1
kind: Pod
metadata:
  name: windows-pod
spec:
  nodeSelector:
    kubernetes.io/os: windows
  containers:
    - name: app
      image: mcr.microsoft.com/windows/servercore:ltsc2022
      volumeMounts:
        - name: tmp
          mountPath: C:/tmp
  volumes:
    - name: tmp
      emptyDir: {}

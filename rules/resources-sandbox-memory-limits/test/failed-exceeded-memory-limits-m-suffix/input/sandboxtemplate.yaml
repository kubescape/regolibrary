apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: excessive-memory-sandbox
  namespace: default
spec:
  podTemplate:
    spec:
      runtimeClassName: gvisor
      containers:
      - name: python-runtime
        image: python:3.11-slim
        resources:
          limits:
            cpu: "500m"
            memory: "1073741824000m"
